services:
  postgres:
    image: postgres:16-alpine
    container_name: openclaw-bridge-postgres
    environment:
      POSTGRES_DB: openclaw_bridge
      POSTGRES_USER: openclaw
      POSTGRES_PASSWORD: openclaw
    volumes:
      - bridge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclaw -d openclaw_bridge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  openclaw-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/alanweb7/openclaw-api-go-2026:local
    container_name: openclaw-bridge
    labels:
      - traefik.enable=true
      - traefik.http.routers.openclaw-bridge.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.openclaw-bridge.entrypoints=websecure
      - traefik.http.routers.openclaw-bridge.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.openclaw-bridge.loadbalancer.server.port=${BRIDGE_HTTP_PORT:-8080}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bridge_state:/app/state
      - bridge_logs:/app/logs
    restart: unless-stopped

volumes:
  bridge_state:
  bridge_logs:
  bridge_postgres_data:
